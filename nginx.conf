events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Allow up to 25MB request body for image uploads
    client_max_body_size 25M;

    # Upstream Next.js app container
    upstream nextjs_upstream {
        server app:3000;
        keepalive 32;
    }

    # Public & Unified Gateway: Port 3001
    # Forwards client Host header intact ($http_host) so Next.js middleware
    # can dynamically distinguish locallytrip.com vs admin.locallytrip.com
    server {
        listen 3001;
        server_name locallytrip.local locallytrip.com admin.locallytrip.com admin.locallytrip.local admin.localhost localhost;

        location /images/ {
            alias /var/www/public/images/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Dedicated Local Admin Portal: Port 3002
    server {
        listen 3002;
        server_name admin.locallytrip.local admin.locallytrip.com admin.localhost localhost;

        location /images/ {
            alias /var/www/public/images/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
