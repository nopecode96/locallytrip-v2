events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Allow up to 25MB request body for image uploads
    client_max_body_size 25M;

    # Upstream Next.js app container in docker network
    upstream nextjs_upstream {
        server app:3000;
        keepalive 32;
    }

    # =================================================================
    # Production HTTP Gateway (Port 80)
    # Serves both locallytrip.com and admin.locallytrip.com
    # Next.js middleware dynamically routes admin traffic based on Host
    # =================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name locallytrip.com www.locallytrip.com admin.locallytrip.com localhost;

        # Direct static media delivery from persistent public/images mount
        location /images/ {
            alias /var/www/public/images/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ACME / Let's Encrypt challenge webroot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Proxy to Next.js upstream with complete header forwarding
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # =================================================================
    # Production HTTPS Gateway (Port 443) - Ready for SSL Activation
    # Uncomment once Let's Encrypt / Certbot or custom SSL certificates exist
