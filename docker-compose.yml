services:
  postgres:
    image: postgres:15-alpine
    container_name: locallytrip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locallytrip_new}
      POSTGRES_USER: ${POSTGRES_USER:-locallytrip_prod_new}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locallytrip_secure_password_new}
    ports:
      - "5434:5432"
    volumes:
      - locallytrip_pgdata:/var/lib/postgresql/data
      - ./prisma/init-seed.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - locallytrip_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-locallytrip_prod_new} -d ${POSTGRES_DB:-locallytrip_new}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: locallytrip_app
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-locallytrip_prod_new}:${POSTGRES_PASSWORD:-locallytrip_secure_password_new}@postgres:5432/${POSTGRES_DB:-locallytrip_new}?schema=public
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public/images:/app/public/images
    networks:
      - locallytrip_network

  nginx:
    image: nginx:alpine
    container_name: locallytrip_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public/images:/var/www/public/images:ro
    depends_on:
      - app
    networks:
      - locallytrip_network

volumes:
  locallytrip_pgdata:
    name: locallytrip_pgdata

networks:
  locallytrip_network:
    name: locallytrip_network
